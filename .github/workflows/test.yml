name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node test/mcp.test.mjs

  windows-backend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node test/mcp.test.mjs
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File test/e2e-inputs.ps1
